services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: datadog-node-app:latest
    container_name: datadog-node-app
    restart: unless-stopped
    depends_on:
      datadog-agent:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      # Datadog unified service tagging
      DD_SERVICE: ${DD_SERVICE:-datadog-node-app}
      DD_ENV: ${DD_ENV:-development}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      # Where to ship traces, metrics and profiles
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_DOGSTATSD_PORT: 8125
    ports:
      - "3000:3000"
    networks:
      - datadog-net
    labels:
      com.datadoghq.tags.service: ${DD_SERVICE:-datadog-node-app}
      com.datadoghq.tags.env: ${DD_ENV:-development}
      com.datadoghq.tags.version: ${DD_VERSION:-1.0.0}

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    restart: unless-stopped
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required - set it in your .env file}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-datadog-node-app-host}
      DD_ENV: ${DD_ENV:-development}
      # Enable APM (traces)
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      # Enable DogStatsD (custom metrics)
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      # Enable log collection for containers in this compose project
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      # Enable Live Process / Container monitoring
      DD_PROCESS_AGENT_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      # Expose locally so you can also send traces/metrics from non-containerized
      # tools if needed. Inside the compose network the app uses the service name.
      - "28125:8125/udp"
      - "28126:8126/tcp"
    networks:
      - datadog-net

networks:
  datadog-net:
    driver: bridge
